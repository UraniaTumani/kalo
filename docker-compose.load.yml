# The stack the load tests run against.
#
#   bash scripts/load-test.sh
#
# Production-shaped like docker-compose.prod.yml — prod profile, nginx in front,
# no seed data — but on its own everything so a load run cannot disturb a
# developer database, the E2E stack, or the rehearsal stack:
#
#   project   kalo-load
#   database  kalo_load
#   volume    kalo-load
#   ports     5435 and 8083
#
# The JVM is given a fixed, modest heap on purpose. A container with no limit
# sizes its heap from the host's memory, so a laptop would hand it far more than
# any pilot server will have and the numbers would flatter the application.
name: kalo-load

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    # Logged so a run can be read back afterwards: which statements were slow,
    # and how close the connection count came to the limit.
    command:
      - postgres
      - -c
      - max_connections=100
      - -c
      - log_min_duration_statement=500
    volumes:
      - kalo-load:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "5435:5432"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1g

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION}
      CORS_ALLOWED_ORIGINS: ""

      # Static: the load tests must measure KALO, not Nominatim's latency, and
      # hammering a public geocoder from a load test would be rude besides.
      GEOCODING_PROVIDER: static

      # nginx is in front, so the forwarded address is the client. This is what
      # lets each virtual user present its own IP and get its own rate-limit
      # bucket — which is what a real pilot looks like, where a thousand users
      # arrive from a thousand addresses rather than one.
      APP_RATE_LIMIT_TRUST_FORWARDED_FOR: "true"

      # Left at its default (true) for the realistic runs. The baseline run
      # overrides it to false and says so in its own report.
      APP_RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}

      # A pilot-sized heap rather than whatever the host happens to have.
      JAVA_TOOL_OPTIONS: "-Xms512m -Xmx1g -XX:MaxMetaspaceSize=256m"
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8080"
    deploy:
      resources:
        limits:
          cpus: "3.0"
          memory: 1600m

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""
    depends_on:
      - backend
    ports:
      - "8083:80"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256m

volumes:
  kalo-load:
