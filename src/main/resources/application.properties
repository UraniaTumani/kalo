spring.application.name=kalo-backend

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/kalo_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

# No fallback on purpose: the application must fail to start rather than run
# with a secret that is publicly readable in source control.
# Development: run with -Dspring.profiles.active=dev (see application-dev.properties)
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION:3600000}

app.ride.company-response-timeout-seconds=60

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

management.endpoints.web.exposure.include=health,info

logging.level.com.kalo=INFO
