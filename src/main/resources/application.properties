spring.application.name=kalo-backend

# There is deliberately no spring.profiles.default here. A default of `dev`
# meant a deployment that set DB_URL but forgot SPRING_PROFILES_ACTIVE would
# start against the production database using the throwaway secret committed to
# this repository, and would seed demo accounts whose passwords are published in
# the README — silently, because the application started normally.
#
# Local development activates the dev profile explicitly: the Maven plugin does
# it for `./mvnw spring-boot:run`, docker-compose sets it, and an IDE run
# configuration needs it set once. See the README.

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/kalo_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

# No fallback on purpose: the application must fail to start rather than run
# with a secret that is publicly readable in source control. Only the dev
# profile supplies a value, and that value is rejected outside dev by
# DevelopmentSafetyGuard.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION:3600000}

app.ride.company-response-timeout-seconds=60

# Comma-separated exact origins for a split-origin deployment, e.g.
# https://app.kalo.al — leave empty when the frontend is served same-origin
# behind a reverse proxy, which is the default topology. Wildcards are rejected.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# API documentation is off unless a deployment opts in. It maps every endpoint,
# parameter and DTO including the admin surface, which is not something to
# publish by default.
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

management.endpoints.web.exposure.include=health,info

logging.level.com.kalo=INFO
