spring.application.name=kalo-backend

# There is deliberately no spring.profiles.default here. A default of `dev`
# meant a deployment that set DB_URL but forgot SPRING_PROFILES_ACTIVE would
# start against the production database using the throwaway secret committed to
# this repository, and would seed demo accounts whose passwords are published in
# the README — silently, because the application started normally.
#
# Local development activates the dev profile explicitly: the Maven plugin does
# it for `./mvnw spring-boot:run`, docker-compose sets it, and an IDE run
# configuration needs it set once. See the README.

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/kalo_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

# No fallback on purpose: the application must fail to start rather than run
# with a secret that is publicly readable in source control. Only the dev
# profile supplies a value, and that value is rejected outside dev by
# DevelopmentSafetyGuard.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION:3600000}

# The access token stays short because it rides on every request. The refresh
# token is what keeps a driver signed in across a shift: 30 days, rotated on
# every use, and revoked when the account is suspended.
app.jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:2592000000}

app.ride.company-response-timeout-seconds=60

# Geocoding runs on this side of the network so a paid provider key never
# reaches a browser, and so the traffic is ours to cache and limit.
#
# `nominatim` needs no key and is the default, but its usage policy caps
# traffic at roughly one request a second and asks people not to use it for
# autocomplete — which is what the booking page does. Replacing it is a new
# GeocodingProvider and a change here. `static` is for tests.
app.geocoding.provider=${GEOCODING_PROVIDER:nominatim}
app.geocoding.user-agent=${GEOCODING_USER_AGENT:MrTaxi/1.0 (taxi marketplace; contact: ops@kalo.al)}
app.geocoding.cache-enabled=${GEOCODING_CACHE_ENABLED:true}

# Comma-separated exact origins for a split-origin deployment, e.g.
# https://app.kalo.al — leave empty when the frontend is served same-origin
# behind a reverse proxy, which is the default topology. Wildcards are rejected.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# API documentation is off unless a deployment opts in. It maps every endpoint,
# parameter and DTO including the admin surface, which is not something to
# publish by default.
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# health and info are public; prometheus and metrics require an ADMIN token,
# because a scrape endpoint describes the shape of the system to anyone who
# can read it. See SecurityConfig.
management.endpoints.web.exposure.include=health,info,metrics,prometheus

# Boot 4 ships metrics export disabled and expects an opt-in, so exposing the
# endpoint is not enough on its own — without this the scrape path 404s while
# everything else looks configured.
management.prometheus.metrics.export.enabled=true

# Details are shown to an authenticated caller only: the sweep indicator
# reports how long rides have gone unswept, which is operational information.
management.endpoint.health.show-details=when_authorized
management.endpoint.health.roles=ADMIN

# Percentiles for request latency, so a slow endpoint is visible as more than
# an average that hides it.
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.observations.annotations.enabled=true

# Tags every metric with the environment it came from, so one dashboard can
# hold more than one deployment without silently adding them together.
management.metrics.tags.application=kalo-backend

# Plain text locally, JSON wherever something is collecting it. Off by default
# because a developer reading a terminal should not have to parse JSON.
logging.structured.format.console=${LOG_FORMAT:}

logging.level.com.kalo=INFO

# The first administrator, and only the first.
#
# Every admin route is behind hasRole("ADMIN"), so there is no way in without
# one — this closes that hole without exposing an unauthenticated route that
# creates superusers. Both values must be set; the account is created only when
# no administrator exists at all, and the phone must not already be registered.
# Clear the password from the environment once you have signed in.
app.admin.bootstrap.phone=${ADMIN_BOOTSTRAP_PHONE:}
app.admin.bootstrap.password=${ADMIN_BOOTSTRAP_PASSWORD:}
app.admin.bootstrap.first-name=${ADMIN_BOOTSTRAP_FIRST_NAME:MR TAXI}
app.admin.bootstrap.last-name=${ADMIN_BOOTSTRAP_LAST_NAME:Administrator}

# Password recovery sends a one-time code by SMS.
#
# There is no provider yet. `log` is the only implementation and it sends
# nothing: it records the message so tests can read it, logs the body under the
# dev profile only, and warns on every send anywhere else so a deployment cannot
# quietly tell people to check a phone that will never ring. Recovery on such a
# deployment goes through the admin fallback.
#
# Adding Infobip or Twilio is a new class implementing SmsSender and one more
# branch in SmsConfig. An unrecognised value here fails at startup rather than
# falling back to `log`, so a typo cannot be the reason codes stop arriving.
app.sms.provider=${SMS_PROVIDER:log}

# The message body contains a live code, so this is false everywhere that is not
# a developer's own machine — and SmsConfig additionally refuses to honour it
# outside the dev profile. A code in a log file is a code in every aggregator and
# pasted support ticket it reaches afterwards.
app.sms.log-message=${SMS_LOG_MESSAGE:false}

# The most recovery messages this deployment will send in any rolling 24 hours.
#
# Not a performance limit. An unauthenticated endpoint that sends SMS is an
# unauthenticated endpoint that spends money, and SMS pumping — farming traffic
# to expensive ranges through whatever form will send it — is a real business.
# Sized well above normal pilot use, so hitting it means something is wrong.
app.sms.daily-limit=${SMS_DAILY_LIMIT:500}

# Infobip, used only when app.sms.provider=infobip.
#
# All three are empty by default and validated at startup when that provider is
# selected, so a deployment asking for Infobip without supplying an account
# fails loudly rather than starting up and delivering nothing.
#
# The base URL is genuinely per-account: Infobip issues each customer a
# personalised host of the form https://xxxxx.api.infobip.com, shown on the API
# dashboard. There is no sensible default, and a guessed one would send a real
# deployment's traffic to a host that rejects its key.
app.sms.infobip.base-url=${INFOBIP_BASE_URL:}

# A credential. Supplied by the environment, like every other secret here, and
# never logged -- SmsConfig checks it is present and never echoes it.
app.sms.infobip.api-key=${INFOBIP_API_KEY:}

# The registered sender ID or number messages come from. Albania, like most of
# the region, requires an alphanumeric sender ID to be registered before traffic
# using it is accepted, so this has no default either: an unregistered ID
# produces messages the operator rejects, which is harder to diagnose than an
# application that will not start.
app.sms.infobip.sender=${INFOBIP_SENDER:}
