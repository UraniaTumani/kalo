spring.application.name=kalo-backend

# Applies ONLY when no profile is active, so `mvn spring-boot:run`, a plain
# `java -jar` and an IDE run configuration all work locally with no setup.
# Any real deployment sets SPRING_PROFILES_ACTIVE, which replaces this, so
# production still has to supply JWT_SECRET and fails fast without it.
spring.profiles.default=dev

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/kalo_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

# No fallback on purpose: with an explicit profile active (production), the
# application must fail to start rather than run with a secret that is publicly
# readable in source control. The dev profile supplies a throwaway value, and
# spring.profiles.default above means local runs pick it up automatically.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION:3600000}

app.ride.company-response-timeout-seconds=60

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

management.endpoints.web.exposure.include=health,info

logging.level.com.kalo=INFO
