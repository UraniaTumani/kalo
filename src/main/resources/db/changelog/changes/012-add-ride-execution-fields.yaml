databaseChangeLog:

  - changeSet:
      id: 012-add-ride-execution-fields
      author: kalo

      changes:

        - addColumn:
            tableName: rides
            columns:

              - column:
                  name: driver_arriving_at
                  type: TIMESTAMP WITH TIME ZONE

              - column:
                  name: driver_arrived_at
                  type: TIMESTAMP WITH TIME ZONE

              - column:
                  name: started_at
                  type: TIMESTAMP WITH TIME ZONE

              - column:
                  name: completed_at
                  type: TIMESTAMP WITH TIME ZONE

              - column:
                  name: final_amount
                  type: NUMERIC(12,2)