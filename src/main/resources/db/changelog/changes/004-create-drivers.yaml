databaseChangeLog:

  - changeSet:
      id: 004-create-drivers
      author: kalo

      changes:

        - createTable:
            tableName: drivers

            columns:

              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_drivers
                    nullable: false

              - column:
                  name: company_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: first_name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false

              - column:
                  name: last_name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false

              - column:
                  name: phone
                  type: VARCHAR(30)
                  constraints:
                    nullable: false

              - column:
                  name: license_number
                  type: VARCHAR(100)
                  constraints:
                    nullable: false

              - column:
                  name: license_expiry_date
                  type: DATE
                  constraints:
                    nullable: false

              - column:
                  name: date_of_birth
                  type: DATE

              - column:
                  name: rating
                  type: DOUBLE PRECISION

              - column:
                  name: status
                  type: VARCHAR(30)
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: drivers
            baseColumnNames: company_id
            referencedTableName: taxi_companies
            referencedColumnNames: id
            constraintName: fk_drivers_company
            onDelete: RESTRICT

        - addUniqueConstraint:
            tableName: drivers
            columnNames: phone
            constraintName: uk_drivers_phone

        - addUniqueConstraint:
            tableName: drivers
            columnNames: license_number
            constraintName: uk_drivers_license_number

        - createIndex:
            tableName: drivers
            indexName: idx_drivers_company_id
            columns:
              - column:
                  name: company_id

        - createIndex:
            tableName: drivers
            indexName: idx_drivers_status
            columns:
              - column:
                  name: status