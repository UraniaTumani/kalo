databaseChangeLog:

  - changeSet:
      id: 006-create-driver-vehicle-assignments
      author: kalo

      changes:

        - createTable:
            tableName: driver_vehicle_assignments

            columns:

              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_driver_vehicle_assignments
                    nullable: false

              - column:
                  name: driver_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: vehicle_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: assigned_from
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

              - column:
                  name: assigned_until
                  type: TIMESTAMP WITH TIME ZONE

              - column:
                  name: active
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: driver_vehicle_assignments
            baseColumnNames: driver_id
            referencedTableName: drivers
            referencedColumnNames: id
            constraintName: fk_driver_vehicle_assignment_driver
            onDelete: RESTRICT

        - addForeignKeyConstraint:
            baseTableName: driver_vehicle_assignments
            baseColumnNames: vehicle_id
            referencedTableName: vehicles
            referencedColumnNames: id
            constraintName: fk_driver_vehicle_assignment_vehicle
            onDelete: RESTRICT

        - createIndex:
            tableName: driver_vehicle_assignments
            indexName: idx_driver_vehicle_assignments_driver
            columns:
              - column:
                  name: driver_id

        - createIndex:
            tableName: driver_vehicle_assignments
            indexName: idx_driver_vehicle_assignments_vehicle
            columns:
              - column:
                  name: vehicle_id

        - createIndex:
            tableName: driver_vehicle_assignments
            indexName: idx_driver_vehicle_assignments_active
            columns:
              - column:
                  name: active