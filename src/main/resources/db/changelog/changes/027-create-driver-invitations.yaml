databaseChangeLog:
  - changeSet:
      id: 027-create-driver-invitations
      author: kalo
      comment: >
        One-time hashed invitations for driver account activation. No public
        activation endpoint or delivery channel is introduced by this migration.
      changes:
        - createTable:
            tableName: driver_invitations
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_driver_invitations
                    nullable: false
              - column:
                  name: driver_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: company_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: token_hash
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
              - column:
                  name: expires_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: redeemed_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: revoked_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: driver_invitations
            baseColumnNames: driver_id
            referencedTableName: drivers
            referencedColumnNames: id
            constraintName: fk_driver_invitations_driver
            onDelete: RESTRICT
        - addForeignKeyConstraint:
            baseTableName: driver_invitations
            baseColumnNames: company_id
            referencedTableName: taxi_companies
            referencedColumnNames: id
            constraintName: fk_driver_invitations_company
            onDelete: RESTRICT
        - addUniqueConstraint:
            tableName: driver_invitations
            columnNames: token_hash
            constraintName: uk_driver_invitations_token_hash
        - createIndex:
            tableName: driver_invitations
            indexName: idx_driver_invitations_driver_created
            columns:
              - column:
                  name: driver_id
              - column:
                  name: created_at
