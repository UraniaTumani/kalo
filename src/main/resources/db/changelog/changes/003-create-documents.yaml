databaseChangeLog:

  - changeSet:
      id: 003-create-documents
      author: kalo

      changes:

        - createTable:
            tableName: documents

            columns:

              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_documents
                    nullable: false

              - column:
                  name: owner_type
                  type: VARCHAR(30)
                  constraints:
                    nullable: false

              - column:
                  name: owner_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: document_type
                  type: VARCHAR(50)
                  constraints:
                    nullable: false

              - column:
                  name: document_number
                  type: VARCHAR(100)

              - column:
                  name: file_url
                  type: VARCHAR(1000)
                  constraints:
                    nullable: false

              - column:
                  name: issued_at
                  type: DATE

              - column:
                  name: expires_at
                  type: DATE

              - column:
                  name: verification_status
                  type: VARCHAR(30)
                  constraints:
                    nullable: false

              - column:
                  name: rejection_reason
                  type: VARCHAR(1000)

              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

        - createIndex:
            tableName: documents
            indexName: idx_documents_owner
            columns:
              - column:
                  name: owner_type
              - column:
                  name: owner_id

        - createIndex:
            tableName: documents
            indexName: idx_documents_verification_status
            columns:
              - column:
                  name: verification_status