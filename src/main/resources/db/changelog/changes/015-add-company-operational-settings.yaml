databaseChangeLog:

  - changeSet:
      id: 015-add-company-operational-settings
      author: kalo

      changes:

        - addColumn:
            tableName: taxi_companies
            columns:

              - column:
                  name: booking_enabled
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false

        - createTable:
            tableName: taxi_company_payment_methods
            columns:

              - column:
                  name: company_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: payment_method
                  type: VARCHAR(50)
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: taxi_company_payment_methods
            baseColumnNames: company_id
            referencedTableName: taxi_companies
            referencedColumnNames: id
            constraintName: fk_company_payment_methods_company
            onDelete: CASCADE

        - addUniqueConstraint:
            tableName: taxi_company_payment_methods
            columnNames: company_id, payment_method
            constraintName: uk_company_payment_method

        - sql:
            sql: >
              INSERT INTO taxi_company_payment_methods
              (company_id, payment_method)
              SELECT id, 'CASH'
              FROM taxi_companies;