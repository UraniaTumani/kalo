databaseChangeLog:

  - changeSet:
      id: 005-create-vehicles
      author: kalo

      changes:

        - createTable:
            tableName: vehicles

            columns:

              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_vehicles
                    nullable: false

              - column:
                  name: company_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: plate_number
                  type: VARCHAR(30)
                  constraints:
                    nullable: false

              - column:
                  name: brand
                  type: VARCHAR(100)
                  constraints:
                    nullable: false

              - column:
                  name: model
                  type: VARCHAR(100)
                  constraints:
                    nullable: false

              - column:
                  name: manufacture_year
                  type: INTEGER
                  constraints:
                    nullable: false

              - column:
                  name: seats
                  type: INTEGER
                  constraints:
                    nullable: false

              - column:
                  name: vehicle_type
                  type: VARCHAR(30)
                  constraints:
                    nullable: false

              - column:
                  name: registration_expiry_date
                  type: DATE

              - column:
                  name: insurance_expiry_date
                  type: DATE

              - column:
                  name: technical_inspection_expiry_date
                  type: DATE

              - column:
                  name: status
                  type: VARCHAR(30)
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: vehicles
            baseColumnNames: company_id
            referencedTableName: taxi_companies
            referencedColumnNames: id
            constraintName: fk_vehicles_company
            onDelete: RESTRICT

        - addUniqueConstraint:
            tableName: vehicles
            columnNames: plate_number
            constraintName: uk_vehicles_plate_number

        - createIndex:
            tableName: vehicles
            indexName: idx_vehicles_company_id
            columns:
              - column:
                  name: company_id

        - createIndex:
            tableName: vehicles
            indexName: idx_vehicles_status
            columns:
              - column:
                  name: status

        - createIndex:
            tableName: vehicles
            indexName: idx_vehicles_type
            columns:
              - column:
                  name: vehicle_type