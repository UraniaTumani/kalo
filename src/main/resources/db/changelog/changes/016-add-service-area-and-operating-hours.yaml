databaseChangeLog:

  - changeSet:
      id: 016-add-service-area-and-operating-hours
      author: kalo

      changes:

        - addColumn:
            tableName: taxi_companies
            columns:

              - column:
                  name: service_center_latitude
                  type: DOUBLE PRECISION

              - column:
                  name: service_center_longitude
                  type: DOUBLE PRECISION

              - column:
                  name: service_radius_km
                  type: DOUBLE PRECISION

              - column:
                  name: timezone
                  type: VARCHAR(50)
                  defaultValue: Europe/Tirane
                  constraints:
                    nullable: false

        - createTable:
            tableName: company_operating_hours
            columns:

              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: company_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: day_of_week
                  type: VARCHAR(20)
                  constraints:
                    nullable: false

              - column:
                  name: open_time
                  type: TIME

              - column:
                  name: close_time
                  type: TIME

              - column:
                  name: closed
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: company_operating_hours
            baseColumnNames: company_id
            referencedTableName: taxi_companies
            referencedColumnNames: id
            constraintName: fk_operating_hours_company
            onDelete: CASCADE

        - addUniqueConstraint:
            tableName: company_operating_hours
            columnNames: company_id, day_of_week
            constraintName: uk_company_operating_hours_day