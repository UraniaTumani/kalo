databaseChangeLog:
  - changeSet:
      id: 024-password-reset-otp
      author: kalo
      comment: >
        Turns the administrator-worked recovery queue into a one-time code sent
        to the number on the account.

        No table is created and nothing is deleted. The old design already held
        everything an OTP needs — a bcrypt hash, an expiry, an attempt counter —
        because the code it minted had the same properties; what it lacked was a
        way to deliver one. So this adds the two columns that separate a texted
        code from a code an administrator vouched for, and closes the rows that
        were sitting in a state the new flow does not have.

        issued_by_user_id and issued_at are deliberately kept. They stop being
        part of the normal path and become the audit columns for the fallback,
        which is the one case SMS cannot cover: a number that no longer reaches
        anybody. Dropping them would have thrown away the record of every code
        an administrator has already issued.

        Note the channel backfill below: existing rows become SMS, and only
        those carrying an issued_by_user_id become ADMIN_FALLBACK. Marking every
        historical row as a fallback would fill the audit trail with entries
        where nobody vouched for anything.
      changes:
        # SMS or ADMIN_FALLBACK, and existing rows start as SMS.
        #
        # The tempting backfill is ADMIN_FALLBACK, on the reasoning that under
        # the old design every code was minted by an administrator. That is true
        # of the rows that got a code and false of most of them: a request
        # entered the queue with no code at all, and the majority were rejected
        # or abandoned before anybody issued anything. Marking those as
        # fallbacks puts rows in the audit trail where nobody vouched for
        # anything — issued_by, issued_at and the note all null — which is noise
        # in the one listing that has to stay readable. The update below moves
        # only the rows where an administrator genuinely did.
        #
        # SMS also stays as the column default afterwards. Hibernate always
        # writes this field so little depends on it, but if a row is ever
        # inserted by hand the harmless direction is the ordinary channel: a
        # default of ADMIN_FALLBACK would fabricate an audit entry claiming
        # somebody was vouched for.
        - addColumn:
            tableName: password_reset_requests
            columns:
              - column:
                  name: channel
                  type: VARCHAR(30)
                  defaultValue: SMS
                  constraints:
                    nullable: false

              # How the administrator established who they were talking to.
              # Mandatory on the fallback endpoint and validated at 20
              # characters, so it cannot be waved through with "ok" — the field
              # exists to make the checking happen, not only to record it.
              #
              # Null for every SMS recovery, and for the historical rows that
              # predate the requirement.
              - column:
                  name: verification_note
                  type: VARCHAR(500)
                  constraints:
                    nullable: true

        # The rows that really were administrator-issued: a code was minted and
        # somebody's id was recorded against it. issued_by_user_id is the only
        # honest evidence of that, and it is exactly what the audit trail is for.
        - update:
            tableName: password_reset_requests
            columns:
              - column:
                  name: channel
                  value: ADMIN_FALLBACK
            where: issued_by_user_id IS NOT NULL

        # The deployment-wide daily ceiling counts recent rows by channel, which
        # is a scan over created_at that the (status, created_at) index above
        # cannot serve — its leading column is status and this query does not
        # name one.
        - createIndex:
            tableName: password_reset_requests
            indexName: idx_password_reset_requests_created_at
            columns:
              - column:
                  name: created_at

        # PENDING and ISSUED no longer exist.
        #
        # Nothing usable is being closed. A PENDING row never had a code at all,
        # and an ISSUED one expired fifteen minutes after it was minted, so every
        # row this touches was already dead — it just had not been marked. Left
        # unmarked they would be invisible to the application and permanently
        # unreadable by the enum, which is how a stale row becomes a mystery
        # eighteen months later.
        #
        # completed_at is only written where it is null, so a row that already
        # recorded when it ended keeps its own timestamp rather than being
        # restamped with the migration's.
        - update:
            tableName: password_reset_requests
            columns:
              - column:
                  name: status
                  value: REJECTED
            where: status IN ('PENDING', 'ISSUED')

        - update:
            tableName: password_reset_requests
            columns:
              - column:
                  name: completed_at
                  valueComputed: now()
            where: status = 'REJECTED' AND completed_at IS NULL

        # Any code hash still sitting on a closed row is a spent secret kept for
        # no reason. Cheap to clear, and it means a leak of this table exposes
        # only codes that are actually live.
        - update:
            tableName: password_reset_requests
            columns:
              - column:
                  name: code_hash
                  # valueComputed rather than an empty `value`, which YAML parses
                  # to a Java null that Liquibase cannot distinguish from an
                  # absent attribute. This emits SET code_hash = NULL and leaves
                  # no doubt about it.
                  valueComputed: "NULL"
            where: status <> 'ACTIVE' AND code_hash IS NOT NULL

      rollback:
        - dropIndex:
            tableName: password_reset_requests
            indexName: idx_password_reset_requests_created_at
        - dropColumn:
            tableName: password_reset_requests
            columnName: verification_note
        - dropColumn:
            tableName: password_reset_requests
            columnName: channel
