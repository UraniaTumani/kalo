databaseChangeLog:

  - changeSet:
      id: 002-create-taxi-companies
      author: kalo

      changes:

        - createTable:
            tableName: taxi_companies

            columns:

              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_taxi_companies
                    nullable: false

              - column:
                  name: owner_user_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: legal_name
                  type: VARCHAR(200)
                  constraints:
                    nullable: false

              - column:
                  name: display_name
                  type: VARCHAR(150)
                  constraints:
                    nullable: false

              - column:
                  name: nipt
                  type: VARCHAR(30)
                  constraints:
                    nullable: false

              - column:
                  name: phone
                  type: VARCHAR(30)
                  constraints:
                    nullable: false

              - column:
                  name: email
                  type: VARCHAR(255)

              - column:
                  name: address
                  type: VARCHAR(500)
                  constraints:
                    nullable: false

              - column:
                  name: license_number
                  type: VARCHAR(100)

              - column:
                  name: license_expiry_date
                  type: DATE

              - column:
                  name: verification_status
                  type: VARCHAR(30)
                  constraints:
                    nullable: false

              - column:
                  name: status
                  type: VARCHAR(30)
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: taxi_companies
            baseColumnNames: owner_user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_taxi_companies_owner_user
            onDelete: RESTRICT

        - addUniqueConstraint:
            tableName: taxi_companies
            columnNames: nipt
            constraintName: uk_taxi_companies_nipt

        - addUniqueConstraint:
            tableName: taxi_companies
            columnNames: owner_user_id
            constraintName: uk_taxi_companies_owner_user

        - createIndex:
            tableName: taxi_companies
            indexName: idx_taxi_companies_verification_status
            columns:
              - column:
                  name: verification_status

        - createIndex:
            tableName: taxi_companies
            indexName: idx_taxi_companies_status
            columns:
              - column:
                  name: status