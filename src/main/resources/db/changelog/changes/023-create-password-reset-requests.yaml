databaseChangeLog:
  - changeSet:
      id: 023-create-password-reset-requests
      author: kalo
      comment: >
        Password recovery, verified by a person rather than by a message.

        KALO has no SMS or email provider, and the phone on an account has
        never been verified — phone_verified is written false at registration
        and nothing in production ever sets it true. So there is no channel
        over which a self-service reset could prove who is asking, and a reset
        that trusts a phone number alone is a reset for whoever knows the
        number.

        This table is the queue instead: a request arrives with no code on it,
        an administrator rings the number already on the account, and only
        after that does the server mint a code. code_hash is therefore null
        until someone has been identified.

        The code is short because it is read aloud, so unlike refresh_tokens it
        is bcrypt rather than SHA-256: forty bits of entropy behind a fast hash
        would fall to a GPU in minutes if this table ever leaked. attempts
        bounds the online guess, bcrypt bounds the offline one.
      changes:
        - createTable:
            tableName: password_reset_requests
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_password_reset_requests_user
                    references: users(id)
                    deleteCascade: true
              - column:
                  name: status
                  type: VARCHAR(30)
                  constraints:
                    nullable: false
              # Null until an administrator has verified the caller and issued
              # a code. Bcrypt, so it is never recoverable — the raw code is
              # returned once, to be read down the phone, and never stored.
              - column:
                  name: code_hash
                  type: VARCHAR(255)
                  constraints:
                    nullable: true
              - column:
                  name: expires_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: true
              - column:
                  name: attempts
                  type: INTEGER
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: issued_by_user_id
                  type: BIGINT
                  constraints:
                    nullable: true
                    foreignKeyName: fk_password_reset_requests_issued_by
                    references: users(id)
              - column:
                  name: issued_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: true
              - column:
                  name: completed_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: true
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

        # The admin queue reads pending requests oldest first, and the
        # per-account throttle counts a user's recent requests.
        - createIndex:
            tableName: password_reset_requests
            indexName: idx_password_reset_requests_user
            columns:
              - column:
                  name: user_id

        - createIndex:
            tableName: password_reset_requests
            indexName: idx_password_reset_requests_status
            columns:
              - column:
                  name: status
              - column:
                  name: created_at
