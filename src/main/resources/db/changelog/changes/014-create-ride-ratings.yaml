databaseChangeLog:

  - changeSet:
      id: 014-create-ride-ratings
      author: kalo

      changes:

        - createTable:
            tableName: ride_ratings
            columns:

              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: ride_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: customer_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: company_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: driver_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: driver_rating
                  type: INT
                  constraints:
                    nullable: false

              - column:
                  name: company_rating
                  type: INT
                  constraints:
                    nullable: false

              - column:
                  name: comment
                  type: VARCHAR(1000)

              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

        - addUniqueConstraint:
            tableName: ride_ratings
            columnNames: ride_id
            constraintName: uk_ride_ratings_ride

        - addForeignKeyConstraint:
            baseTableName: ride_ratings
            baseColumnNames: ride_id
            referencedTableName: rides
            referencedColumnNames: id
            constraintName: fk_ride_ratings_ride

        - addForeignKeyConstraint:
            baseTableName: ride_ratings
            baseColumnNames: customer_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_ride_ratings_customer

        - addForeignKeyConstraint:
            baseTableName: ride_ratings
            baseColumnNames: company_id
            referencedTableName: taxi_companies
            referencedColumnNames: id
            constraintName: fk_ride_ratings_company

        - addForeignKeyConstraint:
            baseTableName: ride_ratings
            baseColumnNames: driver_id
            referencedTableName: drivers
            referencedColumnNames: id
            constraintName: fk_ride_ratings_driver

        - sql:
            sql: >
              ALTER TABLE ride_ratings
              ADD CONSTRAINT chk_ride_ratings_driver_rating
              CHECK (driver_rating >= 1 AND driver_rating <= 5);

        - sql:
            sql: >
              ALTER TABLE ride_ratings
              ADD CONSTRAINT chk_ride_ratings_company_rating
              CHECK (company_rating >= 1 AND company_rating <= 5);

        - addColumn:
            tableName: taxi_companies
            columns:

              - column:
                  name: rating
                  type: DOUBLE PRECISION

              - column:
                  name: rating_count
                  type: INT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false

        - addColumn:
            tableName: drivers
            columns:

              - column:
                  name: rating_count
                  type: INT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false