# DEVELOPMENT PROFILE ONLY.
#
# This secret is intentionally throwaway and is safe to keep in source control
# because it is never used outside the `dev` profile. Production reads
# JWT_SECRET from the environment (see application.properties).
app.jwt.secret=${JWT_SECRET:ZGV2LW9ubHktc2VjcmV0LWZvci1sb2NhbC1rYWxvLWJhY2tlbmQtZGV2ZWxvcG1lbnQ=}

# Seeds demo data on startup (never active outside this profile).
app.dev.seed.enabled=true

logging.level.com.kalo=DEBUG

# There is no SMS provider, so the recovery code cannot arrive on a phone. This
# writes the message body to the log instead, which is the only way to complete
# the flow on a machine with no provider account.
#
# Development only in two senses: the property is here rather than in
# application.properties, and SmsConfig refuses to honour it unless the dev or
# test profile is active — so setting SMS_LOG_MESSAGE=true against a real
# deployment does not start writing live codes into its logs.
app.sms.log-message=true
