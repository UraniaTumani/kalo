# Test-only JWT secret. Throwaway value: tests never talk to a real deployment.
app.jwt.secret=dGVzdC1vbmx5LXNlY3JldC1mb3Ita2Fsby1iYWNrZW5kLWludGVncmF0aW9uLXRlc3Rz
app.jwt.expiration=3600000
app.jwt.refresh-expiration=2592000000

app.ride.company-response-timeout-seconds=60

# The datasource is supplied by Testcontainers via @ServiceConnection.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

logging.level.com.kalo=INFO

# The suite signs in many times per minute from one address, which would trip
# the limiter and make unrelated tests fail. RateLimitIntegrationTest turns it
# back on for itself.
app.rate-limit.enabled=false

# The sweep fires every five seconds, which would race tests against their own
# fixtures. RideTimeoutIntegrationTest calls the service directly instead, so it
# controls exactly when a sweep happens.
app.ride.timeout-sweep.enabled=false

# The send is asynchronous in production, on purpose: a provider call on the
# request thread would overrun the constant-time floor on /password/forgot for
# registered numbers only. Synchronous here so a test can read the message
# immediately after the request instead of polling for it — the property under
# test is the code, not the threading. SmsAsyncConfigurationTest covers the
# production default.
app.sms.async=false

# Same reason as the ride timeout sweep above: a licence sweep firing mid-test
# would take a fixture driver offline underneath the test that had just brought
# them online. DriverLicenseSweepIntegrationTest calls the service directly.
app.driver.license-sweep.enabled=false
