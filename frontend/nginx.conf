# Serves the built frontend and forwards the API, so the browser only ever
# talks to one origin and no CORS headers are involved.

upstream kalo_backend {
    server backend:8080;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The app does its own escaping; these cover the rest.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Third-party hosts are listed explicitly because the app genuinely needs
    # them: OpenStreetMap tiles and the Nominatim geocoder. Anything else is
    # blocked, which is the point.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.tile.openstreetmap.org; connect-src 'self'; font-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /api/ {
        proxy_pass http://kalo_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # The backend only trusts this when app.rate-limit.trust-forwarded-for
        # is on, which is correct for this topology: requests arrive here first.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # The health probe, and only the health probe.
    #
    # Without this, /actuator/health fell through to the SPA fallback below and
    # answered 200 with index.html — so an uptime monitor or load balancer
    # pointed at it would report a healthy service while the backend was down.
    #
    # Everything else under /actuator stays unroutable from outside on purpose.
    # The application already limits exposure to health, info, metrics and
    # prometheus, and restricts the last of those to an admin; not routing them
    # means a future loosening of that config still would not publish anything.
    # A metrics scraper belongs on the internal network, talking to the backend
    # directly, which is where it can already reach :8080.
    location = /actuator/health {
        proxy_pass http://kalo_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;

        access_log off;
    }

    # Hashed assets are immutable, so they can be cached indefinitely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Client-side routing: unknown paths are app routes, not missing files.
    # index.html itself must never be cached, or a deploy ships stale asset
    # references.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
