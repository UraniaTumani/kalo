name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      # Testcontainers starts PostgreSQL itself, so no service container is
      # declared here — the suite must run the same way it does locally, with
      # the migrations applied to a real database.
      - name: Run tests
        run: ./mvnw -B clean test

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # `npm run build` runs tsc -b first, so a type error fails the job.
      - name: Type-check and build
        run: npm run build

      - name: Lint
        run: npm run lint

  images:
    name: Build images
    runs-on: ubuntu-latest
    # Only after both suites pass, so an image can never be produced from a
    # commit whose tests failed.
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      # Built but not pushed: this proves the Dockerfiles work on every commit
      # without this repository having to hold registry credentials yet.
      - name: Build backend image
        run: docker build -t kalo-backend:${{ github.sha }} .

      - name: Build frontend image
        run: docker build -t kalo-frontend:${{ github.sha }} ./frontend

  e2e:
    name: Browser tests
    runs-on: ubuntu-latest
    # After the unit-level suites: a browser run is the slowest way to discover
    # something a backend test would have caught in seconds.
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # Chrome rather than the bundled Chromium: the config uses the `chrome`
      # channel so the same browser runs here and on a developer's machine.
      - name: Install Chrome
        working-directory: frontend
        run: npx playwright install --with-deps chrome

      # Brings up its own PostgreSQL and backend, seeded fresh, and takes them
      # down afterwards. Nothing here touches a developer database.
      - name: Run browser tests
        working-directory: frontend
        run: npm run test:e2e

      - name: Publish report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/e2e/.report/
          retention-days: 7

  # A single job that says, in one place, whether main is safe to merge into.
  # Branch protection points at this one check rather than four, so adding a
  # suite later does not mean editing the protection rule.
  regression:
    name: Regression gate
    runs-on: ubuntu-latest
    needs: [backend, frontend, e2e]
    if: always()

    steps:
      - name: Fail unless every suite passed
        run: |
          echo "backend:  ${{ needs.backend.result }}"
          echo "frontend: ${{ needs.frontend.result }}"
          echo "e2e:      ${{ needs.e2e.result }}"

          if [ "${{ needs.backend.result }}"  != "success" ] || \
             [ "${{ needs.frontend.result }}" != "success" ] || \
             [ "${{ needs.e2e.result }}"      != "success" ]; then
            echo "::error::One or more suites did not pass. main is not safe to merge into."
            exit 1
          fi

          echo "All suites passed."
