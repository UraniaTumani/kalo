name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      # Testcontainers starts PostgreSQL itself, so no service container is
      # declared here — the suite must run the same way it does locally, with
      # the migrations applied to a real database.
      - name: Run tests
        run: ./mvnw -B clean test

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # `npm run build` runs tsc -b first, so a type error fails the job.
      - name: Type-check and build
        run: npm run build

      - name: Lint
        run: npm run lint

  images:
    name: Build images
    runs-on: ubuntu-latest
    # Only after both suites pass, so an image can never be produced from a
    # commit whose tests failed.
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      # Built but not pushed: this proves the Dockerfiles work on every commit
      # without this repository having to hold registry credentials yet.
      - name: Build backend image
        run: docker build -t kalo-backend:${{ github.sha }} .

      - name: Build frontend image
        run: docker build -t kalo-frontend:${{ github.sha }} ./frontend
